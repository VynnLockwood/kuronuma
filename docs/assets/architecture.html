<title id="kuronuma-arch-title">How Kuronuma fits together</title>
<desc id="kuronuma-arch-desc">Your browser and your AI assistant reach Kuronuma through a reverse proxy. The proxy sends page requests to the web dashboard, sign-in requests to the sign-in and OAuth service, which talks to Google, and tool requests to the MCP endpoint. The MCP endpoint calls the memory modules, which read and write a private PostgreSQL database. The sign-in and OAuth service also stores users, sessions and tokens in the same database.</desc>

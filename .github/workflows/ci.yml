name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/api/go.sum
      - name: go.sum must be committed and in sync
        run: |
          if [ ! -f go.sum ]; then
            echo "::error::apps/api/go.sum is missing. Run 'cd apps/api && go mod tidy' with Go 1.26 and commit go.mod and go.sum."
            exit 1
          fi
          go mod tidy -diff || {
            echo "::error::go.mod/go.sum are out of date. Run 'go mod tidy' in apps/api and commit the result."
            exit 1
          }
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-config:
    name: Docker, compose and nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -t kuronuma-api:ci apps/api
      - name: Build web image
        run: docker build -t kuronuma-web:ci apps/web
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config -q
        env:
          POSTGRES_PASSWORD: ci-only
          SESSION_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only
      - name: Validate nginx config
        # api/web hostnames only exist inside compose, so point them at localhost for the syntax test.
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/proxy.conf:/etc/nginx/kuronuma-proxy.conf:ro" \
            nginx:1.30-alpine nginx -t

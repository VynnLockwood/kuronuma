name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    name: Conventional Commits title
    # Dependabot titles are set by its commit-message prefix; skip bot PRs opened before that.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|chore|ci|refactor|test|perf|build|revert)(\([a-z0-9._/-]+\))?!?: .{3,}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must look like 'type(scope): summary', for example 'feat(plutus): add spending summary'. Got: $TITLE"
            exit 1
          fi

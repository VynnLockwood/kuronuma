# Run from the repo root:
#   cp .env.example .env   # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file .env up --build
name: nemosyne

services:
  # Gaia: storage. Not published to the host; only the api can reach it.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nemosyne
      POSTGRES_DB: nemosyne
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - gaia:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemosyne -d nemosyne"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Go backend: Cerberus (auth) now; Hermes (MCP) and the modules later.
  api:
    build: ../apps/api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_ADDR: ":8081"
      DATABASE_URL: postgres://nemosyne:${POSTGRES_PASSWORD}@postgres:5432/nemosyne?sslmode=disable
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -base64 48)}
      SESSION_TTL: ${SESSION_TTL:-336h}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Olympus: Next.js dashboard.
  web:
    build: ../apps/web
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Propylaea: the only service published to the host.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api, web]
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy.conf:/etc/nginx/nemosyne-proxy.conf:ro

volumes:
  gaia:

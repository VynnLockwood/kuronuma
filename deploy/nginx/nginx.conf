# Propylaea: the edge. Routes by path; the api and web containers are never published directly.
#
# TLS: terminate it in front of this container (load balancer, Caddy, or certbot added here)
# and set PUBLIC_URL to the https:// origin. Add an HSTS header once HTTPS is in place.
#
# Rate limits are per client IP. If another proxy (Cloudflare, a load balancer) sits in front of
# this container, every user shares that proxy's IP: configure real_ip_header / set_real_ip_from first.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # Google sign-in endpoints only (not /api/auth/me, which the dashboard calls on every load).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
  # OAuth endpoints for assistants (registration, authorize, token). Hosted assistants may share an IP, so this is generous.
  limit_req_zone $binary_remote_addr zone=oauth:10m rate=120r/m;
  # MCP tool calls.
  limit_req_zone $binary_remote_addr zone=mcp:10m rate=600r/m;
  # Session check, called on every dashboard load. Generous, but not unlimited.
  limit_req_zone $binary_remote_addr zone=session:10m rate=120r/m;

  upstream api { server api:8081; }
  upstream web { server web:3000; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /api/auth/google/ {
      limit_req zone=auth burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      include /etc/nginx/nemosyne-proxy.conf;
    }

    # Cerberus as OAuth server: dynamic client registration, consent page, token endpoint.
    location /api/oauth/ {
      limit_req zone=oauth burst=60 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      include /etc/nginx/nemosyne-proxy.conf;
    }

    location = /api/auth/me {
      limit_req zone=session burst=60 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      include /etc/nginx/nemosyne-proxy.conf;
    }

    location /api/ {
      proxy_pass http://api;
      include /etc/nginx/nemosyne-proxy.conf;
    }

    # OAuth discovery documents that MCP clients fetch to find the authorization server.
    location /.well-known/ {
      limit_req zone=oauth burst=60 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      include /etc/nginx/nemosyne-proxy.conf;
    }

    # Hermes: MCP over Streamable HTTP. Buffering is off so streamed responses are never held back.
    location = /mcp {
      limit_req zone=mcp burst=100 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      include /etc/nginx/nemosyne-proxy.conf;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 120s;
    }

    location / {
      proxy_pass http://web;
      include /etc/nginx/nemosyne-proxy.conf;
    }
  }
}

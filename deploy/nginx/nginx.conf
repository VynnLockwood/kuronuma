# Propylaea: the edge. Routes by path; the api and web containers are never published directly.
#
# TLS: terminate it in front of this container (load balancer, Caddy, or certbot added here)
# and set PUBLIC_URL to the https:// origin. Add an HSTS header once HTTPS is in place.

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;

  # Google sign-in endpoints only (not /api/auth/me, which the dashboard calls on every load).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

  upstream api { server api:8081; }
  upstream web { server web:3000; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /api/auth/google/ {
      limit_req zone=auth burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://api;
      include /etc/nginx/nemosyne-proxy.conf;
    }

    location /api/ {
      proxy_pass http://api;
      include /etc/nginx/nemosyne-proxy.conf;
    }

    # Hermes (MCP over streamable HTTP) arrives in a later slice. Streaming responses
    # need buffering off and long read timeouts, so the route is reserved here.
    location /mcp {
      proxy_pass http://api;
      include /etc/nginx/nemosyne-proxy.conf;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    location / {
      proxy_pass http://web;
      include /etc/nginx/nemosyne-proxy.conf;
    }
  }
}
